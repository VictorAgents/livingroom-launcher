name: Build and installer checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-28' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk-not-release-signed
          path: app/build/outputs/apk/debug/*.apk
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source and privacy guard
        shell: powershell
        run: ./scripts/Check-Public.ps1
      - name: Mock device regression (no real device)
        shell: powershell
        run: ./tests/Test-Installer.ps1
